# Xone K2 — 2-channel DJ controller.
#
# CC numbers follow the K2's layout as documented in its MIDI spec. Verify
# against the hardware before trusting them in a live set; a wrong number here
# shows up as a control that never fires, not as an error.
device: "Xone K2"
match: substring

modifiers:
  shift:
    kind: cc
    chan: 1
    num: 49
    pressed: 127
    released: 0
    mode: momentary

controls:
  # Channel faders and pitch.
  - midi: {kind: cc, chan: 1, num: 9}
    action: {kind: DeckPitch, target: 0}
  - midi: {kind: cc, chan: 1, num: 10}
    action: {kind: DeckPitch, target: 1}

  # Per-channel EQ: CC 20/21/22 on channel 1, 23/24/25 on channel 2.
  - midi: {kind: cc, chan: 1, num: 20}
    action: {kind: DeckEQLow, target: 0}
  - midi: {kind: cc, chan: 1, num: 21}
    action: {kind: DeckEQMid, target: 0}
  - midi: {kind: cc, chan: 1, num: 22}
    action: {kind: DeckEQHigh, target: 0}
  - midi: {kind: cc, chan: 1, num: 23}
    action: {kind: DeckEQLow, target: 1}
  - midi: {kind: cc, chan: 1, num: 24}
    action: {kind: DeckEQMid, target: 1}
  - midi: {kind: cc, chan: 1, num: 25}
    action: {kind: DeckEQHigh, target: 1}

  # Filter knobs.
  - midi: {kind: cc, chan: 1, num: 30}
    action: {kind: DeckFilterCutoff, target: 0}
  - midi: {kind: cc, chan: 1, num: 31}
    action: {kind: DeckFilterCutoff, target: 1}

  # Crossfader on channel 4.
  - midi: {kind: cc, chan: 4, num: 9}
    action: {kind: CrossfaderSet}

  # Hotcue pads: bare = jump, shift+ = delete.
  - midi: {kind: note, chan: 1, num: 40}
    action: {kind: DeckHotcueJump, target: 0}
    slot: 1
  - midi: {kind: note, chan: 1, num: 41}
    action: {kind: DeckHotcueJump, target: 0}
    slot: 2
  - midi: {kind: note, chan: 1, num: 40}
    mods: [shift]
    action: {kind: DeckHotcueDelete, target: 0}
    slot: 1
